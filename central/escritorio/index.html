<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Ciello</title>
<style>
  :root { --carvao:#161616; --carvao2:#222120; --linha:#34322f; --marfim:#F7F4EC; --cinza:#9A958A; --ouro:#E0A81C; --verde:#3DBE6E; --vermelho:#E2553E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--carvao); color:var(--marfim); font-family: Inter, "Segoe UI", Arial, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--linha); }
  header b { font-family: Oswald, "Arial Narrow", sans-serif; letter-spacing:6px; font-size:18px; }
  header span { color:var(--cinza); font-size:13px; }
  header .ponto { width:10px; height:10px; border-radius:50%; background:var(--ouro); box-shadow:0 0 10px var(--ouro); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:18px; padding:18px 22px; }
  .card { background:var(--carvao2); border:1px solid var(--linha); border-radius:14px; padding:16px 18px; }
  .card h2 { margin:0 0 12px; font-size:12px; letter-spacing:4px; color:var(--ouro); font-weight:600; text-transform:uppercase; }
  .lado { display:flex; flex-direction:column; gap:18px; }
  .kpis { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .kpi { background:#1b1a19; border-radius:10px; padding:10px 12px; }
  .kpi small { color:var(--cinza); font-size:11px; display:block; }
  .kpi strong { font-size:24px; font-family: Oswald, "Arial Narrow", sans-serif; }
  .kpi em { font-style:normal; font-size:11px; margin-left:6px; }
  .bom { color:var(--verde); } .ruim { color:var(--vermelho); } .neutro { color:var(--cinza); }
  .funil div { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:12px; }
  .funil i { display:block; height:16px; background:var(--ouro); border-radius:4px; min-width:2px; }
  .funil span { width:78px; color:var(--cinza); } .funil b { width:30px; text-align:right; }
  .feed div { font-size:12px; padding:5px 0; border-bottom:1px solid #2a2927; display:flex; gap:8px; }
  .feed time { color:var(--cinza); width:42px; }
  .vazio { color:var(--cinza); font-size:12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="ponto"></div><b>PAINEL CIELLO</b><span>crescimento · comercial · anúncios — o escritório dos agentes é o pixel-agents (porta 3100)</span><span id="relogio"></span></header>
<main>
  <div class="lado">
    <div class="card"><h2>Crescimento · Instagram</h2><div id="insta" class="kpis"></div><svg id="serie" width="100%" height="46"></svg></div>
    <div class="card"><h2>Anúncios</h2><div id="ads" class="kpis"></div></div>
  </div>
  <div class="lado">
    <div class="card"><h2>Comercial · funil</h2><div id="funil" class="funil"></div></div>
    <div class="card"><h2>Atividade das ferramentas</h2><div id="feed" class="feed"></div></div>
  </div>
</main>
<script>
const NOMES = { 'pesquisador-mercado': 'Pesquisa', roteirista: 'Roteiro', 'produtor-video': 'Vídeo', 'produtor-imagem': 'Imagem', postagem: 'Postagem',
  analista: 'Análise', 'gestor-anuncios': 'Anúncios', sdr: 'SDR', closer: 'Closer' };

// ------------------------------------------------------------------ dados
const fmt = n => (n ?? 0).toLocaleString('pt-BR');
const ROTULO = { trabalhando: 'trabalhando', pensando: 'pensando', esperando: 'precisa de você', pronto: 'pronto', erro: 'erro', parado: 'parado' };
const COR = { trabalhando: 'bom', pensando: 'neutro', esperando: 'ruim', pronto: 'bom', erro: 'ruim', parado: 'neutro' };

async function puxarEstado() {
  try {
    const r = await (await fetch('/api/estado')).json();
    document.getElementById('feed').innerHTML = r.eventos.slice(0, 12).map(e =>
      `<div><time>${e.ts.slice(11, 16)}</time><span>${NOMES[e.agente] || e.agente}: ${ROTULO[e.estado] || e.estado} · ${e.tarefa}</span></div>`).join('') || '<p class="vazio">Sem atividade ainda.</p>';
  } catch (e) { /* servidor fora do ar: tenta de novo */ }
}

function kpi(rotulo, valor, extra = '', classe = 'neutro') {
  return `<div class="kpi"><small>${rotulo}</small><strong>${valor}</strong><em class="${classe}">${extra}</em></div>`;
}

async function puxarKpis() {
  const k = await (await fetch('/api/kpis')).json();
  const i = k.instagram;
  document.getElementById('insta').innerHTML = i ? [
    kpi('Seguidores', fmt(i.seguidores), i.seguidores_antes != null ? `${i.seguidores - i.seguidores_antes >= 0 ? '+' : ''}${i.seguidores - i.seguidores_antes}` : '', i.seguidores >= (i.seguidores_antes ?? 0) ? 'bom' : 'ruim'),
    kpi('Alcance 30 dias', fmt(i.alcance)),
    kpi('Tempo médio no reel', `${i.tempo_medio}s`, 'meta 6s', i.tempo_medio >= 6 ? 'bom' : 'ruim'),
    kpi('Salvamentos / alcance', `${i.salvamentos_pct}%`, 'meta 1%', i.salvamentos_pct >= 1 ? 'bom' : 'ruim'),
  ].join('') : '<p class="vazio">Sem retrato em metricas/ ainda.</p>';
  const s = (i && i.serie) || [];
  if (s.length > 1) {
    const max = Math.max(...s.map(p => p.seguidores)), min = Math.min(...s.map(p => p.seguidores));
    const pts = s.map((p, j) => `${(j / (s.length - 1)) * 100}%,${40 - ((p.seguidores - min) / Math.max(1, max - min)) * 34}`);
    document.getElementById('serie').innerHTML = `<polyline fill="none" stroke="#E0A81C" stroke-width="2" points="${pts.join(' ')}"/>`;
  } else document.getElementById('serie').innerHTML = '<text x="0" y="28" fill="#9A958A" font-size="11">A curva de seguidores aparece a partir do 2º retrato semanal.</text>';
  const f = k.funil;
  if (f) {
    const topo = Math.max(1, f.etapas[0].n);
    document.getElementById('funil').innerHTML = f.etapas.map((e, j) => {
      const conv = j ? ` <small class="neutro">${f.etapas[j - 1].n ? Math.round(100 * e.n / f.etapas[j - 1].n) : 0}%</small>` : '';
      return `<div><span>${e.etapa}</span><i style="width:${Math.max(2, 100 * e.n / topo) * 0.6}%"></i><b>${e.n}</b>${conv}</div>`;
    }).join('') + `<p class="vazio">${f.total} leads · ${f.perdidos} perdidos/frios</p>`;
  } else document.getElementById('funil').innerHTML = '<p class="vazio">Sem leads ainda. Rode o SDR: python central/sdr.py consultas → buscar → qualificar.</p>';
  const a = k.anuncios;
  document.getElementById('ads').innerHTML = a ? [
    kpi('Investido', `R$ ${fmt(a.gasto)}`), kpi('Conversas', fmt(a.conversas)),
    kpi('Custo por conversa', a.custo_conversa != null ? `R$ ${a.custo_conversa}` : '–'),
    kpi('Custo por cliente', a.custo_cliente != null ? `R$ ${a.custo_cliente}` : '–'),
  ].join('') : '<p class="vazio">Nenhuma campanha registrada em anuncios/. O gestor de anúncios grava cada teste lá.</p>';
}

setInterval(puxarEstado, 1500); puxarEstado();
setInterval(puxarKpis, 30000); puxarKpis();
setInterval(() => document.getElementById('relogio').textContent = new Date().toLocaleString('pt-BR'), 1000);
</script>
</body>
</html>
